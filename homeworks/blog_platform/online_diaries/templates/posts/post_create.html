{% extends 'base.html' %}

{% block title %}
    Создание поста
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-8">

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">

                <h1 class="mb-4">
                    Создать пост
                </h1>

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">
                            Тема
                        </label>
                        {{ form.topic }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Текст
                        </label>
                        {{ form.text }}
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Опубликовать
                    </button>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
