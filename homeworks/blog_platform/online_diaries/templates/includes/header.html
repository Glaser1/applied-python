<!-- templates/includes/header.html -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'posts:posts_list' %}">Django Blog</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'posts:posts_list' %}">Все посты</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url 'posts:post_create' %}">Создать пост</a>
        </li>
      </ul>

      <form type="get" action="." style="margin: 0">
        <input id="search_box" type="text" name="search_box" placeholder="Поиск поста по теме..." />
        <button id="search_submit" type="submit">Найти</button>
      </form>

      <ul class="navbar-nav">
        {% if user.is_authenticated %}
          <li class="nav-item">
            <span class="nav-link">Привет, {{ user.username }}</span>
          </li>
          <li class="nav-item">
            <form class="nav-link" action="{% url 'auth:logout' %}" method="post">
              {% csrf_token %}
              <button type="submit">Выйти</button>
            </form>
          </li>
        {% else %}
          <li class="nav-item">
            <a class="nav-link" href="{% url 'auth:login' %}">Войти</a>
          </li>
           <li class="nav-item">
            <a class="nav-link" href="{% url 'auth:signup' %}">Зарегистрироваться</a>
          </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
